[tool.poetry]
name = "error-architecture"
version = "0.1.0"
description = "Production-grade error handling with middleware pipeline architecture"
authors = ["Haris Nadeem harisbinnadeem01@gmail.com"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
mypy = "^1.5"

[tool.mypy]
strict = true
mypy_path = "src"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
